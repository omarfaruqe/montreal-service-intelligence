services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: montreal_services
      POSTGRES_USER: montreal_app
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U montreal_app -d montreal_services"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: