services:
  migrate:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://montreal_app:local_dev_password@db:5432/montreal_services
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "alembic", "upgrade", "head"]

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://montreal_app:local_dev_password@db:5432/montreal_services
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  dashboard:
    build: .
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      api:
        condition: service_healthy
    command:
      - python
      - -m
      - streamlit
      - run
      - dashboard/app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true